id           = "dunarand/bookmarks"
name         = "Bookmarks"
version      = "0.3.1"
min_noctalia = "5.0.0"
plugin_api   = 13
author       = "dunarand"
license      = "MIT"
icon         = "bookmark"
description  = "A user-defined list of bookmarks. Each item has a label, a glyph, and a shell command."
tags         = ["launcher", "productivity", "utility"]
dependencies = []

[[widget]]
id    = "bar"
entry = "bar.luau"

    [[widget.setting]]
    key             = "glyph"
    type            = "glyph"
    label_key       = "settings.glyph.label"
    description_key = "settings.glyph.description"
    default         = "bookmark"

    [[widget.setting]]
    key             = "tooltip"
    type            = "string"
    label_key       = "settings.tooltip.label"
    description_key = "settings.tooltip.description"
    default         = "Bookmarks"

    [[widget.setting]]
    key             = "text"
    type            = "string"
    label_key       = "settings.text.label"
    description_key = "settings.text.description"
    default         = "Bookmarks"

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 380
height          = 470
placement       = "attached"
position        = "auto"
open_near_click = true
capture_keys    = ["enter", "up", "down", "ctrl+n", "ctrl+p"]
